<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MediKiosk - AI Clinical History Platform | All India Institute of Ayurveda</title>
    <meta name="description" content="Patient-facing AI clinical history kiosk with multimodal Bhashini voice/touch intake, Dashavidha Pariksha, medical document OCR, red-flag triage, and ABDM/FHIR physician summary." />
    <meta property="og:title" content="MediKiosk - AI Clinical History Platform" />
    <meta property="og:description" content="Patient-facing AI clinical history intake kiosk with multimodal voice/touch intake, Ayush Dashavidha Pariksha, and ABDM FHIR EMR integration." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Manrope:wght@300;400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/index.css" />

    <style>
      @keyframes medikiosk-spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>

    <script>
      (function() {
        function reportError(details) {
          try {
            fetch('/api/client-error', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(details),
            }).catch(function() {});
          } catch(e) {}
        }

        window.addEventListener('error', function(event) {
          var msg = event.message || String(event);
          if (msg.includes('WebSocket') || msg.includes('@vite/client')) {
            return;
          }
          var payload = {
            type: 'window.error',
            message: msg,
            source: event.filename || '',
            lineno: event.lineno,
            colno: event.colno,
            stack: (event.error && event.error.stack) || '',
            url: window.location.href,
          };
          console.error('[MediKiosk Window Error]', payload);
          reportError(payload);

          // If root has not mounted after error, render diagnostic banner
          var rootEl = document.getElementById('root');
          if (rootEl && (!rootEl.firstElementChild || rootEl.querySelector('#medikiosk-initial-loader'))) {
            rootEl.innerHTML =
              '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background-color:#C9C5AF;padding:20px;font-family:sans-serif;color:#26312B;">' +
              '<div style="background-color:#E3DDCA;border:1px solid #A9AA94;border-radius:10px;padding:24px;max-width:480px;text-align:center;box-shadow:0 4px 14px rgba(38,49,43,0.08);">' +
              '<div style="width:48px;height:48px;border-radius:8px;background:#A65F49;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:24px;margin-bottom:12px;">!</div>' +
              '<h3 style="margin:0 0 8px;font-size:18px;font-weight:700;">MediKiosk Startup Diagnostic</h3>' +
              '<p style="margin:0 0 12px;font-size:13px;color:#596058;">A client script encountered an issue during startup:</p>' +
              '<pre style="text-align:left;background:#B5B7A1;padding:10px;border-radius:6px;font-size:11px;overflow-x:auto;margin:0 0 16px;white-space:pre-wrap;">' +
              msg +
              '</pre>' +
              '<button onclick="localStorage.clear();location.reload();" style="padding:10px 20px;background:#29483C;color:#F0EBDD;border:none;border-radius:8px;font-weight:600;cursor:pointer;font-size:14px;">Reload & Clear Cache</button>' +
              '</div></div>';
          }
        });

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason || 'Unhandled promise rejection';
          var reasonStr = String(reason);
          var stackStr = (reason && reason.stack) || '';
          if (
            reasonStr.includes('WebSocket') ||
            stackStr.includes('WebSocket') ||
            stackStr.includes('@vite/client') ||
            reasonStr.includes('closed without opened')
          ) {
            return;
          }
          var payload = {
            type: 'unhandledrejection',
            reason: reasonStr,
            stack: stackStr,
            url: window.location.href,
          };
          console.error('[MediKiosk Unhandled Rejection]', payload);
          reportError(payload);
        });
      })();
    </script>
  </head>
  <body class="bg-[#C9C5AF] text-[#26312B] font-sans antialiased selection:bg-[#B99B6B]/30 selection:text-[#29483C] min-h-screen">
    <div id="root">
      <div id="medikiosk-initial-loader" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background-color:#C9C5AF;color:#26312B;font-family:sans-serif;">
        <div style="text-align:center;padding:24px;max-width:400px;">
          <div style="width:44px;height:44px;border:3px solid #A9AA94;border-top-color:#29483C;border-radius:50%;margin:0 auto 16px;animation:medikiosk-spin 0.8s linear infinite;"></div>
          <h2 style="margin:0 0 8px;font-size:20px;font-weight:700;color:#26312B;">MediKiosk Terminal</h2>
          <p style="margin:0;font-size:13px;color:#596058;">All India Institute of Ayurveda • Loading Clinical Intake...</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
